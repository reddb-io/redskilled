name: red-marketplace-ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-marketplace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Compose pinned skills
        run: node scripts/prepare-skills.mjs && node scripts/build-pi-packages.mjs

      - name: Validate marketplace manifests
        run: scripts/validate-marketplace-manifests.sh

      - name: Test marketplace manifest validator
        run: scripts/test-validate-marketplace-manifests.sh

      - name: Validate install metadata (claude/codex/pi/npm)
        run: scripts/validate-install-metadata.sh
